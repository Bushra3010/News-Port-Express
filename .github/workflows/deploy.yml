name: Deploy to Cloudflare

# Every push to main redeploys the Worker. Pull requests only run the checks,
# so a branch can be reviewed without touching production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time; a newer push supersedes an older queued run.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Generate the sample stories the suite reads
        run: python3 db/build_demo.py
      - name: Schema, RLS, seed and query tests against PGlite
        run: npm run db:verify

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Deploys only when a CLOUDFLARE_API_TOKEN secret exists. Without one the
      # job notes it and passes, rather than failing every push to main.
      - name: Check for a Cloudflare API token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN secret, so this run did not deploy. Deploy with 'npm run deploy' or add the secret."
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      - name: Build and deploy the Worker
        if: steps.token.outputs.present == 'true'
        run: npm run deploy
        env:
          # The account comes only from account_id in wrangler.jsonc (the
          # NewsPort Express account), so no secret can redirect the deploy.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check the site answers
        if: steps.token.outputs.present == 'true'
        run: |
          url="https://newsport-express.newsport-express.workers.dev/robots.txt"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "robots.txt did not return 200 after deploy" >&2
          exit 1
